name: Android
on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android checks and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug -PreleaseRepository=${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: Chapterlight-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CHAPTERLIGHT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CHAPTERLIGHT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CHAPTERLIGHT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing release signing secrets'; exit 1; }
          export CHAPTERLIGHT_KEYSTORE="$RUNNER_TEMP/chapterlight-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CHAPTERLIGHT_KEYSTORE"
          chmod 600 "$CHAPTERLIGHT_KEYSTORE"
          trap 'rm -f "$CHAPTERLIGHT_KEYSTORE"' EXIT
          ./gradlew assembleRelease -PreleaseRepository=${{ github.repository }}
      - name: Prepare APK and update manifest
        run: python3 tools/package-android-release.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/android/Chapterlight.apk artifacts/android/update.json artifacts/android/SHA256SUMS --verify-tag --title "Chapterlight ${GITHUB_REF_NAME#android-v} · Android" --notes-file artifacts/android/release-notes.md --latest
